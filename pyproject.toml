[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "semantisplat"
version = "1.0.0"
description = "Open-Vocabulary Semantic 3D Scene Search via Gaussian Splatting"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    # Core ML / GPU
    "torch>=2.1.0",
    "torchvision>=0.16.0",

    # 3D Gaussian Splatting
    "gsplat>=1.0.0",

    # Vision-Language
    "open-clip-torch>=2.24.0",

    # Segmentation
    "segment-anything @ git+https://github.com/facebookresearch/segment-anything.git",

    # Image / Video processing
    "opencv-python>=4.8.0",
    "Pillow>=10.0.0",

    # Web API
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.7",
    "websockets>=12.0",

    # Config & utilities
    "pyyaml>=6.0",
    "numpy>=1.24.0",
    "tqdm>=4.66.0",
    "rich>=13.0.0",

    # File I/O
    "plyfile>=1.0",
    
    # Core utilities (used by query API and heatmap)
    "scikit-learn>=1.3.0",
    "matplotlib>=3.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.3.0",
]
eval = [
    "pandas>=2.1.0",
]

[project.scripts]
semantisplat = "semantisplat.pipeline:main"

[tool.setuptools.packages.find]
include = ["semantisplat*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
